[project]
name = "linkjac"

[check.lint]
ignore = ["strip-comments", "strip-docstrings"]

# WORKAROUND(GAP-038): run `capped --mem 4G -- neojac test -j 3`; the default of one build per core is killed for memory and reported as "failed to build".
[test]
directories = ["."]

[packages]
rest_bridge = { path = "../plugins/rest_bridge" }

# WORKAROUND(GAP-037, GAP-039): one project-wide transport that stands in for the standard one and also carries the CLI's calls.
[transport]
plugin = "rest_bridge"

[transport.rest_bridge]
api_prefix = "/api/"
call_path = "/__jac/call/api/rest/handle"
public_call_path = "/__jac/call/api/rest/handle_public"
static_prefix = "/static/"

# The address the cli app calls by default (neojac docs apps/crossings); JAC_REMOTE_API overrides it where the program runs.
[apps.cli.remote]
api = "http://127.0.0.1:8000"

[npm.web]
private = true
type = "module"

[npm.web.dependencies]
react = "^19.1.0"
react-dom = "^19.1.0"
react-router-dom = "^7.6.0"

[npm.web.devDependencies]
"@vitejs/plugin-react" = "^5.0.0"
vite = "^7.1.0"
