<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 510" width="472" height="510" class="arch" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
<style>
.arch { --ink: #1d2433; --soft: #5b6578; --line: #8792a6; --paper: #ffffff; --fill: #f5f7fb; --band: #eef2f8; --bad: #c62828; background: var(--paper); }
@media (prefers-color-scheme: dark) { .arch { --ink: #e6e9f0; --soft: #a3adbf; --line: #6f7a8e; --paper: #14171d; --fill: #1d222b; --band: #232a35; --bad: #ff6b6b; } }
.arch text { fill: var(--ink); white-space: pre; }
.arch .heading { font-weight: 700; }
.arch .soft, .arch .label { fill: var(--soft); }
.arch .box rect { fill: var(--fill); stroke: var(--line); stroke-width: 1.2; }
.arch .box.band rect { fill: var(--band); }
.arch .box.outside rect { stroke-dasharray: 4 3; fill: var(--paper); }
.arch .box .title { font-weight: 700; }
.arch .box .cap { fill: var(--paper); stroke: none; }
.arch .box.opens, .arch .arrow { cursor: pointer; }
.arch .arrow path { fill: none; stroke: var(--line); stroke-width: 1.4; }
.arch .arrow .hit { stroke: transparent; stroke-width: 10; }
.arch .arrow.declared path.line { stroke-dasharray: 2 4; }
.arch .arrow:hover path.line, .arch .box.opens:hover rect.frame { stroke: var(--ink); }
.arch .bad rect.frame, .arch .bad path.line { stroke: var(--bad); }
.arch .arrow.picked path.line { stroke: var(--ink); stroke-width: 2.4; }
.arch .bad .label, .arch .bad .title { fill: var(--bad); }
.arch marker path { fill: var(--line); stroke: none; }
</style>
<defs><marker id="arch-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="heading" x="12" y="25" textLength="56" lengthAdjust="spacingAndGlyphs">linkjac</text>
<g class="arrow" data-key="layer:domain&gt;layer:rest"><title>arrow from domain to rest</title><path class="hit" d="M200,273 L200,342"/><path class="line" d="M200,273 L200,342" marker-end="url(#arch-head)"/><text class="label" x="212" y="295" textLength="56" lengthAdjust="spacingAndGlyphs">Exposes</text></g>
<g class="arrow" data-key="ecosystem:std&gt;layer:domain"><title>arrow from the runtime and standard library to domain</title><path class="hit" d="M216,93 L216,144"/><path class="line" d="M216,93 L216,144" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:python&gt;layer:domain"><title>arrow from Python to domain</title><path class="hit" d="M376,93 L376,144"/><path class="line" d="M376,93 L376,144" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:python&gt;layer:rest"><title>arrow from Python to rest</title><path class="hit" d="M408,93 L408,111 L456,111 L456,147"/><path class="line" d="M408,93 L408,111 L456,111 L456,147"/><path class="hit" d="M456,147 L456,309 L392,309 L392,342"/><path class="line" d="M456,147 L456,309 L392,309 L392,342" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:std&gt;layer:rest"><title>arrow from the runtime and standard library to rest</title><path class="hit" d="M80,93 L80,111 L16,111 L16,147"/><path class="line" d="M80,93 L80,111 L16,111 L16,147"/><path class="hit" d="M16,147 L16,309 L128,309 L128,342"/><path class="line" d="M16,147 L16,309 L128,309 L128,342" marker-end="url(#arch-head)"/></g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer domain" data-id="layer:domain" data-kind="layer"><rect class="frame" x="40" y="147" width="392" height="126" rx="5"/><rect class="cap" x="52" y="138" width="64" height="18"/><text class="title" x="60" y="151" textLength="48" lengthAdjust="spacingAndGlyphs">domain</text>
<text x="52" y="169" textLength="360" lengthAdjust="spacingAndGlyphs">Bookmarks and tags, and the rules for keeping</text>
<text x="52" y="187" textLength="40" lengthAdjust="spacingAndGlyphs">them.</text>
<text x="52" y="223" textLength="288" lengthAdjust="spacingAndGlyphs">bookmarks · clock · ids · matching ·</text>
<text x="52" y="241" textLength="368" lengthAdjust="spacingAndGlyphs">profiles · search · search_expression · tags ·</text>
<text x="52" y="259" textLength="32" lengthAdjust="spacingAndGlyphs">urls</text>
</g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer rest" data-id="layer:rest" data-kind="layer"><rect class="frame" x="56" y="345" width="352" height="126" rx="5"/><rect class="cap" x="68" y="336" width="48" height="18"/><text class="title" x="76" y="349" textLength="32" lengthAdjust="spacingAndGlyphs">rest</text>
<text x="68" y="367" textLength="328" lengthAdjust="spacingAndGlyphs">The REST layer: linkding's /api/ over the</text>
<text x="68" y="385" textLength="56" lengthAdjust="spacingAndGlyphs">domain.</text>
<text x="68" y="421" textLength="280" lengthAdjust="spacingAndGlyphs">rest · rest_bookmarks · rest_call ·</text>
<text x="68" y="439" textLength="312" lengthAdjust="spacingAndGlyphs">rest_forms · rest_paging · rest_reply ·</text>
<text x="68" y="457" textLength="168" lengthAdjust="spacingAndGlyphs">rest_tags · rest_user</text>
</g>
<g class="box ecosystem outside" data-id="ecosystem:std" data-kind="ecosystem"><rect class="frame" x="16" y="57" width="304" height="36" rx="5"/><rect class="cap" x="28" y="48" width="272" height="18"/><text class="title" x="36" y="61" textLength="256" lengthAdjust="spacingAndGlyphs">the runtime and standard library</text>
<text x="28" y="79" textLength="272" lengthAdjust="spacingAndGlyphs">datetime · hashlib · json · urllib</text>
</g>
<g class="box ecosystem outside" data-id="ecosystem:python" data-kind="ecosystem"><rect class="frame" x="360" y="57" width="96" height="36" rx="5"/><rect class="cap" x="372" y="48" width="64" height="18"/><text class="title" x="380" y="61" textLength="48" lengthAdjust="spacingAndGlyphs">Python</text>
<text x="372" y="79" textLength="48" lengthAdjust="spacingAndGlyphs">stdjac</text>
</g>
</svg>
