<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 744" width="840" height="744" class="arch" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
<style>
.arch { --ink: #1d2433; --soft: #5b6578; --line: #8792a6; --paper: #ffffff; --fill: #f5f7fb; --band: #eef2f8; --bad: #c62828; background: var(--paper); }
@media (prefers-color-scheme: dark) { .arch { --ink: #e6e9f0; --soft: #a3adbf; --line: #6f7a8e; --paper: #14171d; --fill: #1d222b; --band: #232a35; --bad: #ff6b6b; } }
.arch text { fill: var(--ink); white-space: pre; }
.arch .heading { font-weight: 700; }
.arch .soft, .arch .label { fill: var(--soft); }
.arch .box rect { fill: var(--fill); stroke: var(--line); stroke-width: 1.2; }
.arch .box.band rect { fill: var(--band); }
.arch .box.outside rect { stroke-dasharray: 4 3; fill: var(--paper); }
.arch .box .title { font-weight: 700; }
.arch .box .cap { fill: var(--paper); stroke: none; }
.arch .box.opens, .arch .arrow { cursor: pointer; }
.arch .arrow path { fill: none; stroke: var(--line); stroke-width: 1.4; }
.arch .arrow .hit { stroke: transparent; stroke-width: 10; }
.arch .arrow.declared path.line { stroke-dasharray: 2 4; }
.arch .arrow:hover path.line, .arch .box.opens:hover rect.frame { stroke: var(--ink); }
.arch .bad rect.frame, .arch .bad path.line { stroke: var(--bad); }
.arch .arrow.picked path.line { stroke: var(--ink); stroke-width: 2.4; }
.arch .bad .label, .arch .bad .title { fill: var(--bad); }
.arch marker path { fill: var(--line); stroke: none; }
</style>
<defs><marker id="arch-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text class="heading" x="12" y="25" textLength="56" lengthAdjust="spacingAndGlyphs">linkjac</text>
<g class="arrow" data-key="layer:domain&gt;layer:rest"><title>arrow from domain to rest</title><path class="hit" d="M488,345 L488,399 L544,399 L544,432"/><path class="line" d="M488,345 L488,399 L544,399 L544,432" marker-end="url(#arch-head)"/><text class="label" x="500" y="367" textLength="56" lengthAdjust="spacingAndGlyphs">Exposes</text></g>
<g class="arrow" data-key="layer:domain&gt;layer:service"><title>arrow from domain to service</title><path class="hit" d="M312,345 L312,432"/><path class="line" d="M312,345 L312,432" marker-end="url(#arch-head)"/><text class="label" x="324" y="367" textLength="56" lengthAdjust="spacingAndGlyphs">Exposes</text></g>
<g class="arrow" data-key="layer:service&gt;layer:client"><title>arrow from service to client</title><path class="hit" d="M200,525 L200,597 L208,597 L208,630"/><path class="line" d="M200,525 L200,597 L208,597 L208,630" marker-end="url(#arch-head)"/><text class="label" x="212" y="583" textLength="40" lengthAdjust="spacingAndGlyphs">Calls</text></g>
<g class="arrow" data-key="ecosystem:std&gt;layer:domain"><title>arrow from the runtime and standard library to domain</title><path class="hit" d="M352,111 L352,198"/><path class="line" d="M352,111 L352,198" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:python&gt;layer:domain"><title>arrow from Python to domain</title><path class="hit" d="M600,93 L600,198"/><path class="line" d="M600,93 L600,198" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:std&gt;layer:client"><title>arrow from the runtime and standard library to client</title><path class="hit" d="M248,111 L248,129 L16,129 L16,201"/><path class="line" d="M248,111 L248,129 L16,129 L16,201"/><path class="hit" d="M16,201 L16,435"/><path class="line" d="M16,201 L16,435"/><path class="hit" d="M16,435 L16,597 L184,597 L184,630"/><path class="line" d="M16,435 L16,597 L184,597 L184,630" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:python&gt;layer:client"><title>arrow from Python to client</title><path class="hit" d="M632,93 L632,147 L656,147 L656,201"/><path class="line" d="M632,93 L632,147 L656,147 L656,201"/><path class="hit" d="M656,201 L656,381 L448,381 L448,435"/><path class="line" d="M656,201 L656,381 L448,381 L448,435"/><path class="hit" d="M448,435 L448,597 L344,597 L344,630"/><path class="line" d="M448,435 L448,597 L344,597 L344,630" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:python&gt;layer:rest"><title>arrow from Python to rest</title><path class="hit" d="M664,93 L664,165 L704,165 L704,201"/><path class="line" d="M664,93 L664,165 L704,165 L704,201"/><path class="hit" d="M704,201 L704,432"/><path class="line" d="M704,201 L704,432" marker-end="url(#arch-head)"/></g>
<g class="arrow" data-key="ecosystem:std&gt;layer:rest"><title>arrow from the runtime and standard library to rest</title><path class="hit" d="M456,111 L456,129 L680,129 L680,201"/><path class="line" d="M456,111 L456,129 L680,129 L680,201"/><path class="hit" d="M680,201 L680,432"/><path class="line" d="M680,201 L680,432" marker-end="url(#arch-head)"/></g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer domain" data-id="layer:domain" data-kind="layer"><rect class="frame" x="248" y="201" width="384" height="144" rx="5"/><rect class="cap" x="260" y="192" width="64" height="18"/><text class="title" x="268" y="205" textLength="48" lengthAdjust="spacingAndGlyphs">domain</text>
<text x="260" y="223" textLength="360" lengthAdjust="spacingAndGlyphs">Bookmarks and tags, and the rules for keeping</text>
<text x="260" y="241" textLength="40" lengthAdjust="spacingAndGlyphs">them.</text>
<text x="260" y="277" textLength="288" lengthAdjust="spacingAndGlyphs">bookmarks · clock · ids · matching ·</text>
<text x="260" y="295" textLength="280" lengthAdjust="spacingAndGlyphs">netscape_export · netscape_import ·</text>
<text x="260" y="313" textLength="288" lengthAdjust="spacingAndGlyphs">netscape_parse · profiles · search ·</text>
<text x="260" y="331" textLength="248" lengthAdjust="spacingAndGlyphs">search_expression · tags · urls</text>
</g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer service" data-id="layer:service" data-kind="layer"><rect class="frame" x="40" y="435" width="384" height="90" rx="5"/><rect class="cap" x="52" y="426" width="72" height="18"/><text class="title" x="60" y="439" textLength="56" lengthAdjust="spacingAndGlyphs">service</text>
<text x="52" y="457" textLength="360" lengthAdjust="spacingAndGlyphs">What a signed-in caller can ask the server to</text>
<text x="52" y="475" textLength="128" lengthAdjust="spacingAndGlyphs">do beyond /api/.</text>
<text x="52" y="511" textLength="40" lengthAdjust="spacingAndGlyphs">admin</text>
</g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer client" data-id="layer:client" data-kind="layer"><rect class="frame" x="96" y="633" width="264" height="72" rx="5"/><rect class="cap" x="108" y="624" width="64" height="18"/><text class="title" x="116" y="637" textLength="48" lengthAdjust="spacingAndGlyphs">client</text>
<text x="108" y="655" textLength="240" lengthAdjust="spacingAndGlyphs">Programs that call the server.</text>
<text x="108" y="691" textLength="24" lengthAdjust="spacingAndGlyphs">cli</text>
</g>
<g class="box layer opens" role="button" tabindex="0" aria-label="layer rest" data-id="layer:rest" data-kind="layer"><rect class="frame" x="472" y="435" width="352" height="126" rx="5"/><rect class="cap" x="484" y="426" width="48" height="18"/><text class="title" x="492" y="439" textLength="32" lengthAdjust="spacingAndGlyphs">rest</text>
<text x="484" y="457" textLength="328" lengthAdjust="spacingAndGlyphs">The REST layer: linkding's /api/ over the</text>
<text x="484" y="475" textLength="56" lengthAdjust="spacingAndGlyphs">domain.</text>
<text x="484" y="511" textLength="280" lengthAdjust="spacingAndGlyphs">rest · rest_bookmarks · rest_call ·</text>
<text x="484" y="529" textLength="312" lengthAdjust="spacingAndGlyphs">rest_forms · rest_paging · rest_reply ·</text>
<text x="484" y="547" textLength="168" lengthAdjust="spacingAndGlyphs">rest_tags · rest_user</text>
</g>
<g class="box ecosystem outside" data-id="ecosystem:std" data-kind="ecosystem"><rect class="frame" x="200" y="57" width="344" height="54" rx="5"/><rect class="cap" x="212" y="48" width="272" height="18"/><text class="title" x="220" y="61" textLength="256" lengthAdjust="spacingAndGlyphs">the runtime and standard library</text>
<text x="212" y="79" textLength="320" lengthAdjust="spacingAndGlyphs">datetime · sys · html · hashlib · json ·</text>
<text x="212" y="97" textLength="48" lengthAdjust="spacingAndGlyphs">urllib</text>
</g>
<g class="box ecosystem outside" data-id="ecosystem:python" data-kind="ecosystem"><rect class="frame" x="584" y="57" width="120" height="36" rx="5"/><rect class="cap" x="596" y="48" width="64" height="18"/><text class="title" x="604" y="61" textLength="48" lengthAdjust="spacingAndGlyphs">Python</text>
<text x="596" y="79" textLength="48" lengthAdjust="spacingAndGlyphs">stdjac</text>
</g>
</svg>
